  <body>
    <!-- DESIGN CONTRACT: Personal Calander is an operate-mode workspace, not a wellness dashboard. The first view makes today’s commitments and available time legible in one compact field. Material is cool paper, ink, and one blue command signal; type is Manrope for decisions and DM Mono only for dates, quantities, and system readings. The layout uses a stable task rail, a central attention list, and a temporal edge. One source of visual emphasis: the current action. Motion is limited to tactile feedback and spatial context. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
